services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-facebook_reporting}
      POSTGRES_USER: ${POSTGRES_USER:-facebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-facebook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-facebook_reporting}
      FB_PAGE_ACCESS_TOKEN: ${FB_PAGE_ACCESS_TOKEN:?Set FB_PAGE_ACCESS_TOKEN in .env}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v25.0}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Bangkok}
      DEFAULT_PAGE_ID: ${DEFAULT_PAGE_ID:-1125132200689307}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
