[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facebook-reporting-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.116",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "psycopg[binary]>=3.2",
  "pwdlib[argon2]>=0.3",
  "pydantic-settings>=2.7",
  "python-dateutil>=2.9",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-freezer>=0.4",
  "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
